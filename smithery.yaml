# Smithery server descriptor: https://smithery.ai/docs/build/project-config
# This is a remote (HTTP) MCP server. Smithery proxies requests from its
# users to our Railway-hosted endpoint with the user-supplied API key.
runtime: remote
startCommand:
  type: http
  url: https://mcp.grantiq.us/mcp/
  configSchema:
    type: object
    required: [apiKey]
    properties:
      apiKey:
        type: string
        title: API Key
        description: "Your GrantIQ API key. Mint one via /admin/keys. There is no shared key."
  exampleConfig:
    apiKey: your-api-key
  headerMappings:
    apiKey: X-API-Key
metadata:
  name: GrantIQ MCP
  description: "Search US federal grants and contracts (Grants.gov + SAM.gov) from any LLM."
  homepage: https://mcp.grantiq.us
  repository: https://github.com/bch1212/mcp-grantiq
  tools:
    - search_grants
    - get_grant_details
    - search_contracts
    - get_contract_details
    - match_opportunities
    - get_agencies
    - get_deadlines
    - search_awards
