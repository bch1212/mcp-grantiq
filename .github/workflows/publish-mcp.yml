name: Publish to npm + Anthropic MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write enables (a) npm trusted-publisher OIDC auth on `npm publish`,
      # and (b) the OIDC token exchange against the MCP Registry below.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate server.json basics
        run: |
          test -s server.json
          jq -e '.name and .version and (.description | length <= 100)' server.json

      - name: Install + build npm package
        working-directory: packages/grantiq-mcp
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to npm via Trusted Publisher (OIDC, no token)
        working-directory: packages/grantiq-mcp
        # No NODE_AUTH_TOKEN — relies on the package's configured Trusted
        # Publisher (npmjs.com → grantiq-mcp settings → bch1212/mcp-grantiq +
        # this workflow filename). Provenance is auto-emitted by npm under
        # trusted publishing; the --provenance flag is harmless if kept.
        run: npm publish --provenance --access public

      - name: Wait for npm to index the new version
        run: |
          for i in $(seq 1 12); do
            ver=$(curl -sS "https://registry.npmjs.org/grantiq-mcp" | jq -r '."dist-tags".latest // empty')
            if [ -n "$ver" ]; then echo "npm latest: $ver"; exit 0; fi
            sleep 5
          done
          echo "npm did not index within 60s — continuing anyway"

      - name: Get GitHub Actions OIDC token (registry audience)
        id: oidc
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://registry.modelcontextprotocol.io" \
            | jq -r '.value')
          if [ -z "$token" ] || [ "$token" = "null" ]; then echo "Failed to obtain OIDC token"; exit 1; fi
          echo "::add-mask::$token"
          echo "oidc_token=$token" >> "$GITHUB_OUTPUT"

      - name: Exchange OIDC token for MCP Registry JWT
        id: exchange
        run: |
          resp=$(curl -sS -X POST https://registry.modelcontextprotocol.io/v0/auth/github-oidc \
            -H "content-type: application/json" \
            -d "{\"oidc_token\":\"${{ steps.oidc.outputs.oidc_token }}\"}")
          tok=$(echo "$resp" | jq -r '.token // .registry_token // empty')
          if [ -z "$tok" ]; then echo "No registry token: $resp"; exit 1; fi
          echo "::add-mask::$tok"
          echo "registry_token=$tok" >> "$GITHUB_OUTPUT"

      - name: Submit server.json to MCP Registry
        run: |
          resp=$(curl -sS -X POST https://registry.modelcontextprotocol.io/v0/publish \
            -H "Authorization: Bearer ${{ steps.exchange.outputs.registry_token }}" \
            -H "content-type: application/json" \
            --data @server.json)
          echo "publish resp: $resp"
          if echo "$resp" | grep -qiE '"status":\s*[45]'; then
            if echo "$resp" | grep -qi "already\|duplicate"; then
              echo "Already published — idempotent, ok"; exit 0
            fi
            exit 1
          fi
